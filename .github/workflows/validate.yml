name: Validate plugin package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate package contracts and package boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path(".")
          expected_files = {
              ".claude-plugin/marketplace.json",
              ".claude-plugin/plugin.json",
              ".codex-plugin/plugin.json",
              ".github/workflows/validate.yml",
              ".gitignore",
              ".mcp.json",
              "LICENSE",
              "README.md",
              "SECURITY.md",
              "assets/icon.png",
              "assets/logo.png",
              "review/anthropic-submission.md",
              "review/openai-submission.md",
              "review/tool-annotations.md",
              "mcp.json",
              "plugins/tenqual-discovery/.claude-plugin/plugin.json",
              "plugins/tenqual-discovery/.mcp.json",
              "plugins/tenqual-discovery/CHANGELOG.md",
              "plugins/tenqual-discovery/README.md",
              "plugins/tenqual-discovery/SETUP.md",
              "plugins/tenqual-discovery/agents/tender-analyst.md",
              "plugins/tenqual-discovery/docs/local-verification.md",
              "plugins/tenqual-discovery/docs/tool-surface.md",
              "plugins/tenqual-discovery/skills/alert-management/SKILL.md",
              "plugins/tenqual-discovery/skills/setup/SKILL.md",
              "plugins/tenqual-discovery/skills/tender-review/SKILL.md",
              "plugins/tenqual-discovery/skills/tender-search/SKILL.md",
              "plugin.json",
          }
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          assert tracked == expected_files, sorted(tracked ^ expected_files)
          for relative in tracked:
              path = root / relative
              assert path.is_file() and not path.is_symlink(), relative

          modes = subprocess.check_output(
              ["git", "ls-files", "-s"], text=True
          ).splitlines()
          assert all(line.startswith("100644 ") for line in modes), modes

          codex = json.loads((root / ".codex-plugin/plugin.json").read_text())
          claude = json.loads((root / ".claude-plugin/plugin.json").read_text())
          marketplace = json.loads((root / ".claude-plugin/marketplace.json").read_text())
          mcp = json.loads((root / ".mcp.json").read_text())
          portable = json.loads((root / "plugin.json").read_text())
          portable_mcp = json.loads((root / "mcp.json").read_text())
          nested_plugin = json.loads(
              (root / "plugins/tenqual-discovery/.claude-plugin/plugin.json").read_text()
          )
          nested_mcp = json.loads((root / "plugins/tenqual-discovery/.mcp.json").read_text())
          assert codex["name"] == claude["name"] == portable["name"] == "tenqual-discovery"
          assert codex["version"] == claude["version"] == portable["version"]
          assert marketplace["name"] == "tenqual-plugins"
          assert marketplace["plugins"][0]["name"] == "tenqual-discovery"
          assert marketplace["plugins"][0]["source"] == "./plugins/tenqual-discovery"
          assert nested_plugin["name"] == "tenqual-discovery"
          assert nested_plugin["repository"] == "https://github.com/Tenqual/tenqual-discovery-plugin"
          assert nested_mcp == {
              "mcpServers": {
                  "tenqual": {"type": "http", "url": "https://api.tenqual.com/mcp"}
              }
          }
          assert portable == {
              "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
              "name": "tenqual-discovery",
              "version": "0.3.0",
              "description": (
                  "Search source-backed tender notices, review qualified matches, manage alerts, "
                  "and retrieve matched documents through Tenqual Discovery."
              ),
              "author": {
                  "name": "Tenqual Software AS",
                  "email": "support@tenqual.com",
                  "url": "https://tenqual.com",
              },
              "homepage": "https://github.com/Tenqual/tenqual-discovery-plugin#readme",
              "repository": "https://github.com/Tenqual/tenqual-discovery-plugin",
              "license": "MIT",
              "keywords": ["procurement", "tenders", "discovery", "alerts", "mcp"],
          }
          assert portable_mcp == {
              "$schema": "https://agent-plugins.org/schemas/1.0.0/mcp.schema.json",
              "mcpServers": {
                  "tenqual": {
                      "type": "streamable-http",
                      "url": "https://api.tenqual.com/mcp",
                  }
              },
          }
          assert codex["mcpServers"] == "./.mcp.json"
          assert mcp == {
              "mcpServers": {
                  "tenqual": {"type": "http", "url": "https://api.tenqual.com/mcp"}
              }
          }
          assert claude["mcpServers"] == {
              "tenqual": {"type": "http", "url": "https://api.tenqual.com/mcp"}
          }
          interface = codex["interface"]
          assert len(interface["displayName"]) <= 30
          assert len(interface["shortDescription"]) <= 30
          assert interface["websiteURL"] == "https://tenqual.com"
          assert interface["privacyPolicyURL"] == "https://tenqual.com/privacy"
          assert interface["termsOfServiceURL"] == "https://tenqual.com/terms"
          assert len(interface["defaultPrompt"]) <= 3
          assert all(len(prompt) <= 128 and "\n" not in prompt for prompt in interface["defaultPrompt"])
          assert (root / "assets/icon.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          assert (root / "assets/logo.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          PY
      - name: Validate Anthropic marketplace and plugin contracts
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.228 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.228 plugin validate .claude-plugin/plugin.json --strict
          npx --yes @anthropic-ai/claude-code@2.1.228 plugin validate plugins/tenqual-discovery --strict
      - name: Reject likely committed credentials
        shell: bash
        run: |
          if git rev-list --all | xargs -r git grep -nEI '(tq_(live|mcp_at|mcp_rt)_[A-Za-z0-9_-]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|signing_secret["'"']?[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+)' --; then
            echo "Potential credential material found"
            exit 1
          fi
